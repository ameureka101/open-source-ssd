<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1C1F24" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D68160" />
      <stop offset="100%" stop-color="#F4B49B" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E9F3D" />
      <stop offset="100%" stop-color="#A5D6A7" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E06666" />
      <stop offset="100%" stop-color="#F4A2A2" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowTerracotta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#0E1012" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Header Section -->
  <text x="40" y="42" fill="#6A737D" font-family="monospace" font-size="12">HARD CONTROL PLANE // TYPE SYSTEM &amp; META-GATE GUARDS</text>
  <text x="40" y="68" fill="#D68160" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="22">三 Evidence 类型守卫与 V9 Vacuity 元门禁</text>

  <!-- ================= LEFT: 3-EVIDENCE TYPE GUARD ================= -->
  <g transform="translate(40, 105)">
    <rect width="400" height="350" rx="10" fill="#15181D" stroke="#2A303C" stroke-width="1.5" />
    <rect width="400" height="32" rx="6" fill="#1C212A" />
    <circle cx="16" cy="16" r="4" fill="#A5D6A7" filter="url(#glowGreen)" />
    <text x="28" y="21" fill="#A5D6A7" font-family="monospace" font-size="11" font-weight="bold">TYPESCRIPT TYPE-LEVEL BARRIER</text>

    <text x="20" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">将人审编译进类型系统 (isIndexablePage)</text>
    <text x="20" y="80" fill="#8C95A0" font-family="monospace" font-size="11">防伪签名缺一不可，阻断未授权发布</text>

    <!-- 3 Evidence Checklist Badges -->
    <g transform="translate(20, 95)">
      <!-- Item 1: FactCheck -->
      <rect width="360" height="42" rx="6" fill="#0E1012" stroke="#2D3139" />
      <circle cx="16" cy="21" r="7" fill="#1C2E20" stroke="#4E9F3D" stroke-width="1.5" />
      <path d="M 12 21 L 15 24 L 20 18" fill="none" stroke="#A5D6A7" stroke-width="1.5" />
      <text x="32" y="18" fill="#C9D1D9" font-family="monospace" font-size="11" font-weight="bold">factCheckEvidence</text>
      <text x="32" y="32" fill="#6A737D" font-family="system-ui, sans-serif" font-size="10">事实核验对账完成，无未经验证事实</text>
      <text x="348" y="25" fill="#4E9F3D" font-family="monospace" font-size="9" text-anchor="end">VALID</text>

      <!-- Item 2: Evaluator -->
      <rect y="48" width="360" height="42" rx="6" fill="#0E1012" stroke="#2D3139" />
      <circle cx="16" cy="69" r="7" fill="#1C2E20" stroke="#4E9F3D" stroke-width="1.5" />
      <path d="M 12 69 L 15 72 L 20 66" fill="none" stroke="#A5D6A7" stroke-width="1.5" />
      <text x="32" y="66" fill="#C9D1D9" font-family="monospace" font-size="11" font-weight="bold">evaluatorEvidence</text>
      <text x="32" y="80" fill="#6A737D" font-family="system-ui, sans-serif" font-size="10">四维评测机审通过（合规/质量/SEO/可读性）</text>
      <text x="348" y="73" fill="#4E9F3D" font-family="monospace" font-size="9" text-anchor="end">VALID</text>

      <!-- Item 3: Human Approval -->
      <rect y="96" width="360" height="42" rx="6" fill="#1A1513" stroke="#D68160" />
      <circle cx="16" cy="117" r="7" fill="#3D201A" stroke="#D68160" stroke-width="1.5" />
      <path d="M 12 117 L 15 120 L 20 114" fill="none" stroke="#F4B49B" stroke-width="1.5" />
      <text x="32" y="114" fill="#F4B49B" font-family="monospace" font-size="11" font-weight="bold">humanApprovalEvidence</text>
      <text x="32" y="128" fill="#D68160" font-family="system-ui, sans-serif" font-size="10">必须匹配正则 ^owner-approved-[sha] 签名</text>
      <text x="348" y="121" fill="#D68160" font-family="monospace" font-size="9" text-anchor="end">SIGNED</text>
    </g>

    <!-- Guard Outcome Output -->
    <g transform="translate(20, 255)">
      <rect width="360" height="75" rx="6" fill="#121D16" stroke="#4E9F3D" stroke-width="1" />
      <text x="15" y="24" fill="#A5D6A7" font-family="monospace" font-size="11" font-weight="bold">RESULT: ACCESS SITEMAP &amp; CANONICAL INDEX</text>
      <text x="15" y="44" fill="#C9D1D9" font-family="system-ui, sans-serif" font-size="11">任一 evidence 缺失或时间戳异常 → 编译时直接抛错</text>
      <text x="15" y="62" fill="#8C95A0" font-family="monospace" font-size="10">将“人类批准”从口头约定升级为 CI 构建硬阻断</text>
    </g>
  </g>

  <!-- ================= RIGHT: V9 VACUITY & FAIL-CLOSED ================= -->
  <g transform="translate(465, 105)">
    <rect width="395" height="350" rx="10" fill="#15181D" stroke="#2A303C" stroke-width="1.5" />
    <rect width="395" height="32" rx="6" fill="#1C212A" />
    <circle cx="16" cy="16" r="4" fill="#D68160" filter="url(#glowTerracotta)" />
    <text x="28" y="21" fill="#F4B49B" font-family="monospace" font-size="11" font-weight="bold">META-GATE VERIFICATION &amp; FAIL-CLOSED</text>

    <text x="20" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">门禁有效性检测 (V9 Vacuity)</text>
    <text x="20" y="80" fill="#8C95A0" font-family="monospace" font-size="11">防止“门禁永远全绿但其实没有测试任何东西”</text>

    <!-- Meta-Rule Matrix -->
    <g transform="translate(20, 95)">
      <rect width="355" height="42" rx="6" fill="#0E1012" stroke="#2D3139" />
      <text x="15" y="18" fill="#D68160" font-family="monospace" font-size="11" font-weight="bold">V3 Ratchet 防时空倒流</text>
      <text x="15" y="32" fill="#8C95A0" font-family="system-ui, sans-serif" font-size="10">翻闸日期不得早于其前置依赖项的完成日期</text>

      <rect y="48" width="355" height="42" rx="6" fill="#0E1012" stroke="#2D3139" />
      <text x="15" y="66" fill="#D68160" font-family="monospace" font-size="11" font-weight="bold">V5 Resume 状态污染隔离</text>
      <text x="15" y="80" fill="#8C95A0" font-family="system-ui, sans-serif" font-size="10">重新激活的废弃项，必须强制清空已有的 DONE 标记</text>

      <rect y="96" width="355" height="42" rx="6" fill="#2E1C1C" stroke="#E06666" />
      <text x="15" y="114" fill="#F4A2A2" font-family="monospace" font-size="11" font-weight="bold">V9 Vacuity 空转门禁拦截</text>
      <text x="15" y="128" fill="#E06666" font-family="system-ui, sans-serif" font-size="10">门还开着但 AST 证明事情早已发生 → 报警空转</text>
    </g>

    <!-- Fail-Closed Callout Box -->
    <g transform="translate(20, 255)">
      <rect width="355" height="75" rx="6" fill="#2B1616" stroke="#E06666" stroke-width="1" />
      <text x="15" y="24" fill="#E06666" font-family="monospace" font-size="11" font-weight="bold">FAIL-CLOSED SUPREME PRINCIPLE:</text>
      <text x="15" y="44" fill="#F4A2A2" font-family="monospace" font-size="10">any thrown error inside a gate check →</text>
      <text x="15" y="60" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold">THAT GATE IS RED (NEVER A SILENT PASS)</text>
    </g>
  </g>

  <!-- Bottom Flow Legend -->
  <g transform="translate(40, 475)">
    <rect width="820" height="26" rx="4" fill="#13161B" />
    <text x="15" y="17" fill="#6A737D" font-family="monospace" font-size="10">CORE TAKEAWAY: 优秀的工程 Harness 不是提示词堆砌，而是用编译期类型与严格退出码把控 AI 的行为底线</text>
  </g>

</svg>
